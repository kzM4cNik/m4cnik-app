name: Build M4cNik IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-ipa:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Generate app icon
        run: python3 make-icon.py

      - name: Build unsigned IPA
        run: |
          sed -i '' 's/\r$//' build-ipa.sh 2>/dev/null || sed -i 's/\r$//' build-ipa.sh
          bash build-ipa.sh

      - name: Show build log on failure
        if: failure()
        run: |
          if [ -f xcodebuild.log ]; then
            echo "===== xcodebuild.log (last 120 lines) ====="
            tail -120 xcodebuild.log
          else
            echo "xcodebuild.log not found"
          fi

      - name: Verify IPA
        run: |
          test -f M4cNikApp.ipa
          ls -lh M4cNikApp.ipa
          unzip -l M4cNikApp.ipa | head -20

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: M4cNikApp-ipa
          path: M4cNikApp.ipa
          retention-days: 30
